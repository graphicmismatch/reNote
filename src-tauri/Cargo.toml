[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "renote"
version = "0.0.0"
description = "reNote: a local-first, cross-platform note-taking app with an infinite drawing canvas."
authors = ["reNote contributors"]
edition = "2021"

[lib]
name = "renote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
renote-commands = { path = "crates/renote-commands" }
renote-storage = { path = "crates/renote-storage" }
tauri-plugin-dialog = "2.7.2"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2.0.2"
