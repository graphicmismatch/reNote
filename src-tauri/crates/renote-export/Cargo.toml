[package]
name = "renote-export"
version = "0.0.0"
edition = "2021"
description = "Rust-side PDF generation reconstructed from the page-object model (per-page and batch section/notebook export), plus plain-text export."

[lib]
name = "renote_export"

[dependencies]
printpdf = { version = "0.12.5", default-features = false, features = ["png", "jpeg"] }
renote-storage = { version = "0.0.0", path = "../renote-storage" }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"
