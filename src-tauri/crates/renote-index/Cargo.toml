[package]
name = "renote-index"
version = "0.0.0"
edition = "2021"
description = "Owns the per-notebook SQLite/FTS5 index: a derived, always-rebuildable-from-disk cache for metadata, tags, and full-text search. Never the source of truth — renote-storage's files are."

[lib]
name = "renote_index"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
thiserror = "2"
renote-storage = { path = "../renote-storage" }
model2vec-rs = { version = "0.2.1", default-features = false, features = ["local-only", "fancy-regex"] }

[dev-dependencies]
tempfile = "3"
