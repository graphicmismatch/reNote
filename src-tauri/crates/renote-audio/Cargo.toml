[package]
name = "renote-audio"
version = "0.0.0"
edition = "2021"
description = "Native microphone capture (Phase 12 audio clips) via cpal, encoded as WAV via hound. Exists because WebKitGTK's browser-side MediaRecorder depends on GStreamer plugins (gst-plugins-rs' fmp4/isobmff) that are not reliably present on a plain Linux desktop install, silently producing zero bytes when missing (confirmed live, not hypothetical) -- see renote-commands::audio's doc comment for the full story and why this crate is Linux-only in practice today."

[lib]
name = "renote_audio"

[dependencies]
cpal = "0.15"
hound = "3"
thiserror = "2"
