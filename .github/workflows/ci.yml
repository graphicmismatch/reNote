name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Native modules (esbuild, etc.) get build scripts approved once, in pnpm-workspace.yaml.
  # Keeping this here documents the intent for anyone reading the workflow in isolation.
  PNPM_VERSION: "11.21.0"

jobs:
  # Fast feedback: lint, type-check, package-boundary enforcement, formatting, unit tests.
  # Runs on Linux only — none of this depends on OS-specific behavior.
  checks:
    name: lint, typecheck, boundary-lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Formatting
        run: pnpm format:check

      - name: Boundary lint (package dependency rules)
        run: pnpm boundary-lint

      - name: Boundary lint catches an illegal cross-package import
        run: |
          echo 'import { PageEngine } from "@renote/canvas-engine"; export const proof = PageEngine;' \
            > packages/ui/src/__ci-boundary-violation.ts
          if pnpm boundary-lint; then
            echo "::error::boundary-lint did not fail on a deliberate illegal import"
            exit 1
          fi
          rm packages/ui/src/__ci-boundary-violation.ts

      - name: Unit tests
        run: pnpm test

  # Cross-platform build + Rust checks. This is the Phase 0 exit criterion:
  # a clean checkout must build on Windows, macOS, and Linux.
  build:
    name: build (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend (all workspace packages + apps/desktop)
        run: pnpm build

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: cargo build (Tauri app + all crates)
        run: cargo build --manifest-path src-tauri/Cargo.toml --workspace

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

  # Linux is not one environment: X11 and Wayland diverge on fractional
  # scaling, clipboard/drag-drop, and window decoration (see the project
  # plan's Cross-Platform & Frictionless Install Requirements). Both are
  # exercised here rather than assuming either is representative of "Linux."
  linux-display-smoke:
    name: launch smoke test (linux, ${{ matrix.session }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session: [x11, wayland]
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            build-essential \
            file \
            xvfb \
            weston

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @renote/desktop build
      - run: cargo build --manifest-path src-tauri/Cargo.toml --package renote

      - name: Launch under X11 (Xvfb) and confirm the process stays alive
        if: matrix.session == 'x11'
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          sleep 2
          DISPLAY=:99 GDK_BACKEND=x11 ./src-tauri/target/debug/renote &
          APP_PID=$!
          sleep 8
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::renote exited before the smoke check completed under X11"
            exit 1
          fi
          kill "$APP_PID" || true
          kill "$XVFB_PID" || true

      - name: Launch under headless Wayland (weston) and confirm the process stays alive
        if: matrix.session == 'wayland'
        run: |
          weston --backend=headless-backend.so --width=1280 --height=800 --idle-time=0 &
          WESTON_PID=$!
          sleep 3
          WAYLAND_DISPLAY=wayland-1 GDK_BACKEND=wayland ./src-tauri/target/debug/renote &
          APP_PID=$!
          sleep 8
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::renote exited before the smoke check completed under Wayland"
            exit 1
          fi
          kill "$APP_PID" || true
          kill "$WESTON_PID" || true
